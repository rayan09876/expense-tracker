<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            background: linear-gradient(to right, rgb(193, 78, 211), rgb(228, 143, 207));
        }

        .outer{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 12vh;
            left: 25vw;
            height: auto;
            width: 40vw;
            border: 2px solid black;
            border-radius: 10vh;
            padding: 7.5vh;
            background-color: white;
        }

        .button{
            background-color: lightgreen;
            border: 1px solid black;
            border-radius: 10%;
            padding: 10px 15px;
        }

        .addexpense input, .addexpense, .filter input, .filter, .expenses {
            margin: 5px;
            padding: 10px;
            border: 1px solid black;
            border-radius: 10px;
        }

        .button{
            border-radius: 10%;
        }

        input{
            height: 10px !important;
        }
        .expenses{
            height: 50px !important;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            width: 25vw;
        }

        .expenses button{
            margin-left: 10px;
            background-color: red;
            color: white;
            position: absolute;
            right: 12vw;
        }

        .expenses div{
            position: absolute;
            left: 12vw;
        }

    </style>
</head>
<body>
    <div class="outer">
        <h1>Expense Tracker</h1>
        <div class="addexpense">
            <input type="text" placeholder="Title" id="title">
            <input type="text" placeholder="Amount" id="amount">
            <button class="button" onclick="addexpense()">Add</button>
        </div>

        <div class="expenselist">
            <div class="expenses">
                <div><h2>Expense 1</h2>
                    <p>Amount: $10</p>
                    </div>
                <button>x</button>
            </div>
            <div class="expenses">
                <div><h2>Expense 2</h2>
                    <p>Amount: $20</p>
                    </div>
                <button>x</button>
            </div>
        </div>
        
        <div class="filter">
        <button class="button" onclick="totalExpenses()">Total</button>
        <button class="button" onclick="highestexpenses()">Highest</button>
        <input type="text" placeholder="Filter by Amount" id="filter">
        <button class="button" onclick="filterexpenses()">Filter Expense</button>
        <p class="buttonoutput"></p>
        </div>
        
        <script>
            let expense_list = JSON.parse(localStorage.getItem("expense_list")) || [
                {"id": 1, "expense": "shopping", "amount": 10},
                {"id": 2, "expense": "food", "amount": 20},
                {"id": 3, "expense": "transportation", "amount": 15}
            ]

            function saveExpense(){
                localStorage.setItem("expense_list", JSON.stringify(expense_list))
            }

            function showexpenses(){
                const list = document.querySelector(".expenselist");
                list.innerHTML = "";
                expense_list.forEach( expense => {
                    const div = document.createElement("div")
                    div.className = "expenses"
                    div.innerHTML = `<div><h2>${expense.expense} $ </h2><p>${expense.amount} $ </p></div><button class = "deletebutton" onclick = "deleteExpense(${expense.id})">x</button>`
                    list.appendChild(div)
                })
            }

            function addexpense(){
                let title = document.getElementById("title").value
                let amount = document.getElementById("amount").value

                if(title == "" || amount == ""){
                    alert("please enter valid details")
                    return;
                }

                const newExpense = {
                    id: Date.now(),
                    expense: title,
                    amount: Number(amount)
                }

                expense_list.push(newExpense)
                saveExpense()
                showexpenses()
            }

            function deleteExpense(id){
                expense_list = expense_list.filter( expense => expense.id !== id)
                saveExpense()
                showexpenses()
            }

            function totalExpenses(){

                let total = expense_list.reduce(( total, current) => {
                    return total + Number(current.amount);
                }, 0)

                document.querySelector(".buttonoutput").innerHTML = `<h2>Total Expenses: ${total}</h2>`
            }

            showexpenses()

            function highestexpenses(){

                let highest = expense_list.reduce((highest, current) => {
                    if(highest > current){
                        return highest
                    }else{
                        return current
                    }
                }, 0)

                document.querySelector(".buttonoutput").innerHTML = `<h2>Highest Expense: ${highest.expense} $${highest.amount}</h2>`
            }

            function filterexpenses(){
                let filter = document.getElementById("filter").value
                let filtered = expense_list.filter( expense => expense.amount >= filter)
                let result = filtered.map( expense => {
                   return  `${expense.expense} (${expense.amount})`
                }).join(", ")

                document.querySelector(".buttonoutput").innerHTML = `<h2>Filtered Expenses: ${result}</h2>`

            }

        </script>
</body>
</html>
